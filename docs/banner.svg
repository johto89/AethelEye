<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AETHELeye - Web OSINT and security assessment framework">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.55" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d0ba"/>
      <stop offset="1" stop-color="#4aa8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35d0ba" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#35d0ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="170" cy="160" r="118" fill="url(#glow)"/>

  <g transform="translate(92 72)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <circle cx="78" cy="88" r="88" stroke-opacity="0.85"/>
    <circle cx="78" cy="88" r="66" stroke-opacity="0.65"/>
    <circle cx="78" cy="88" r="44" stroke-opacity="0.5"/>
    <circle cx="78" cy="88" r="22" stroke-opacity="0.35"/>
    <path d="M78 0v24M78 152v24M-10 88h24M142 88h24" stroke-opacity="0.8"/>
    <circle cx="78" cy="88" r="8" fill="#35d0ba" stroke="none"/>
  </g>

  <text x="290" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="2" fill="#f7fbff">AETHEL<tspan fill="#35d0ba">eye</tspan></text>
  <text x="294" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="3.4" fill="#9db2c8">OMNISCIENT RECONNAISSANCE FRAMEWORK</text>
  <line x1="294" y1="230" x2="1110" y2="230" stroke="#35d0ba" stroke-opacity="0.35" stroke-width="2"/>
  <text x="294" y="263" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#7f93a8">For the Modern Era  |  Scope-aware scanning  |  Offline-first workflow  |  Evidence-ready reports</text>
